{% load leaflet_tags %}
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Carte Interactive</title>
    {% leaflet_js %}
    {% leaflet_css %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #mymap {
            height: 100vh;
            width: 100%;
        }

        .layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .layer-control h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .layer-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .layer-item input {
            margin-right: 8px;
        }

        .category-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 2px solid #e0e0e0;
        }

        .category-title:first-child {
            margin-top: 0;
        }

        .layer-color {
            width: 30px;
            height: 4px;
            margin-right: 8px;
            border-radius: 2px;
        }
    </style>
    <script type="text/javascript" src="{% static 'main.js' %}"></script>
</head>

<body>
    {% leaflet_map "mymap" %}

    <div class="layer-control">
        <h3>Couches</h3>
        <div id="layer-list"></div>
    </div>
</body>
