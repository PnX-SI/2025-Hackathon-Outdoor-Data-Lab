services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=hackathondb
      - POSTGRES_PASSWORD=hackathonpasswd
      - POSTGRES_USER=hackathonadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hackathonadmin", "-d", "hackathondb"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  postgres: